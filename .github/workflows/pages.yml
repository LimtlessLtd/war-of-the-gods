# Publishes the campaign site (Website/docs) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish campaign site

on:
  push:
    branches: [main]
    paths: ['Website/docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # only the built site: the rest of the campaign folder is several GB
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Website/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website/docs
      - id: deployment
        uses: actions/deploy-pages@v4
